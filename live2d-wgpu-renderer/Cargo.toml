[package]
name = "live2d-wgpu-renderer"
version = "0.1.0"
edition = "2024"

[dependencies]
wgpu = "27.0.1"
live2d-cubism-core-sys = { path = "vendor/live2d-cubism-core-sys" }
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[dev-dependencies]
winit = "0.30"
pollster = "0.4"
