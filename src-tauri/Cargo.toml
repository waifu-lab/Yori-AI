[package]
name = "Yori-AI"
version = "0.1.0"
description = "A Launcher for personal AI with Yori AI"
authors = [
    "lumina-ai-1104"
]
license = ""
repository = "https://github.com/waifu-lab/Yori-AI"
edition = "2024"
rust-version = "1.91.0"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
# tauri dependencies
tauri = { version = "2.8.5", features = [] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"

# serialization dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
bincode = "1.3.3"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

# multithreading dependencies
parking_lot = { version = "0.12.5", features = ["deadlock_detection"] }
crossbeam-channel = "0.5.15"

# logging dependencies
log = "0.4.28"
fern = { version = "0.7.1", features = ["colored"] }
chrono = "0.4.42"

# utility dependencies
anyhow = "1.0.100"
thiserror = "2.0.17"
rust-i18n = "3.1.5"
libloading = "0.8.9"

# gpu dependencies
wgpu = "24.0.5"
live2d-cubism-core-sys = { git = "https://github.com/James2022-rgb/live2d-cubism-core-sys" }