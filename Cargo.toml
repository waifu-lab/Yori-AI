[workspace]
members = [
    "plugin_lib",
    "src-tauri"
]
resolver = "3"

[workspace.dependencies]
tauri = { version = "2.8.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
parking_lot = { version = "0.12.5", features = ["deadlock_detection"] }
anyhow = "1.0.100"
thiserror = "2.0.17"
rust-i18n = "3.1.5"
log = "0.4.28"
