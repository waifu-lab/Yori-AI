[workspace]
members = [
    "app_lib",
    "src-tauri"
]
resolver = "3"

[workspace.dependencies]
tauri = { version = "2.8.5", features = [] }

serde = { version = "1.0", features = ["derive"] }
parking_lot = "0.12.5"
crossbeam-channel = "0.5.15"
once_cell = "1.21.3"
anyhow = "1.0.100"
thiserror = "2.0.17"
rust-i18n = "3.1.5"
bincode = "1.3.3"