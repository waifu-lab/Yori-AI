name: Build waifu-node

on:
  push:
    tags:
      - "waifu-node-*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: waifu-node-x86_64-pc-windows-msvc.exe
            binary: target/x86_64-pc-windows-msvc/release/waifu-node.exe

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: waifu-node-aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/waifu-node

          - os: macos-13
            target: x86_64-apple-darwin
            artifact: waifu-node-x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/waifu-node

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: waifu-node-x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/waifu-node

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libxcb1-dev \
            libxcb-shm0-dev \
            libxcb-randr0-dev \
            libxcb-xfixes0-dev \
            libx11-dev \
            libxtst-dev \
            libxdo-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build
        run: cargo build --release --package waifu-node --target ${{ matrix.target }}

      - name: Rename artifact
        shell: bash
        run: cp ${{ matrix.binary }} ${{ matrix.artifact }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
